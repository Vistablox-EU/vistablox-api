services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: vistablox
      POSTGRES_PASSWORD: vistablox
      POSTGRES_DB: vistablox
    ports:
      - "5432:5432"
    volumes:
      # postgres 18+'s official image wants the mount one level up from
      # `data` (pg_ctlcluster-style, major-version-specific subdirectory),
      # not directly at /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vistablox -d vistablox"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local-dev-only SMTP catcher so `docker compose up` works without real
  # SMTP credentials. Web UI at http://localhost:8025 shows sent mail.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  minio:
    build:
      context: .
      dockerfile: infrastructure/minio/Dockerfile
    environment:
      MINIO_ROOT_USER: vistablox-local
      MINIO_ROOT_PASSWORD: vistablox-local-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    build:
      context: .
      target: api
    command: ["node", "dist/infrastructure/storage/ensure-minio-bucket.js"]
    environment: &minio-client-environment
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: vistablox-local
      MINIO_SECRET_KEY: vistablox-local-secret
      MINIO_DOCUMENT_BUCKET: vistablox-documents
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DIRECT_DATABASE_URL: postgresql://vistablox:vistablox@postgres:5432/vistablox
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vistablox:vistablox@postgres:5432/vistablox
      RATE_LIMIT_CACHE_URL: redis://cache:6379
      KYC_SERVICE_URL: http://kyc:3000
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_TRUSTED_ORIGINS: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: vistablox
      SMTP_PASSWORD: vistablox
      SMTP_FROM: VistaBlox <no-reply@vistablox.local>
      <<: *minio-client-environment
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vistablox:vistablox@postgres:5432/vistablox
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: vistablox
      SMTP_PASSWORD: vistablox
      SMTP_FROM: VistaBlox <no-reply@vistablox.local>
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Owns the whole KYC domain (the Didit webhook, session creation/status,
  # staff lookups, renewal-reminder timer, stuck-session reconciliation --
  # KYC microservicing effort) -- reuses the worker build stage's image via
  # a `command:` override rather than a dedicated build stage, since the
  # image is otherwise identical. Its DIDIT_*/INTERNAL_KYC_API_SECRET values
  # come from .env via env_file below, same as api/worker's do -- only
  # DATABASE_URL/PROFILE_CACHE_URL need the compose-network override, since
  # those two point at a different host (postgres/cache's service names)
  # than a real deployment would use. SMTP_* is overridden the same way
  # api/worker's is below, so its renewal-reminder email also lands in the
  # local mailpit catcher instead of whatever real SMTP_* is in .env.
  kyc:
    build:
      context: .
      target: worker
    command: ["node", "dist/kyc-server.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vistablox:vistablox@postgres:5432/vistablox
      PROFILE_CACHE_URL: redis://cache:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: vistablox
      SMTP_PASSWORD: vistablox
      SMTP_FROM: VistaBlox <no-reply@vistablox.local>
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
