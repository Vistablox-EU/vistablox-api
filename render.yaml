# Render Blueprint for vistablox-api.
#
# Render's Docker-runtime services don't support selecting a build stage in a
# multi-stage Dockerfile (--target), so both services below build from the
# same Dockerfile, which defaults to its last stage: `worker`. The `worker`
# and `api` stages are otherwise identical (same node_modules, same dist/,
# only the final CMD differs), so the `api` service below overrides its
# startup command via `dockerCommand` instead of needing a second Dockerfile.
#
# `migrate` (prisma migrate deploy) is deliberately NOT run as a Render
# service — it needs the `build` stage's devDependencies (the Prisma CLI),
# which neither `api` nor `worker`'s slimmer runtime image carries, and per
# AD-139 deploys are already manual/human-triggered at this stage. Run it
# from a machine with DIRECT_DATABASE_URL set:
#   npm run db:migrate:deploy
#
# All secret values below use `sync: false`, meaning Render will prompt for
# them in the dashboard rather than storing them in this file. Nothing
# sensitive is committed here.

services:
  - type: web
    name: vistablox-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/server.js
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false # the service's own public Render URL, e.g. https://vistablox-api.onrender.com
      - key: BETTER_AUTH_SECRET
        sync: false # generate per-environment, see README's "Local setup" section
      - key: WEBAUTHN_RP_NAME
        value: VistaBlox
      - key: WEBAUTHN_RP_ID
        sync: false # leave blank to default to BETTER_AUTH_URL's hostname
      - key: WEBAUTHN_ORIGIN
        sync: false # leave blank to default to BETTER_AUTH_URL's origin
      - key: STAFF_INVITATION_ACCEPT_URL
        sync: false
      - key: STAFF_RECOVERY_REDIRECT_URL
        sync: false
      - key: AUTH_TRUSTED_ORIGINS
        sync: false # e.g. https://vistablox-api.onrender.com,com.vistablox.app://
      - key: OIDC_JWKS
        sync: false # generate per-environment, see README's "Local setup" section — do not reuse the local-dev value
      - key: OIDC_NATIVE_REDIRECT_URIS
        value: "com.vistablox.app:/oauth/callback"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PROFILE_CACHE_URL
        sync: false
      - key: RATE_LIMIT_CACHE_URL
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_PORT
        sync: false
      - key: MINIO_USE_SSL
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_DOCUMENT_BUCKET
        sync: false
      # All-together-or-none, enforced by environment.ts's own refine: leave
      # every DIDIT_* value below blank in the dashboard to run without
      # individual KYC. That is a valid, tested configuration, not a
      # misconfiguration -- but it means GET/POST /v1/kyc (and the other KYC
      # routes app.ts mounts alongside them) are never registered, so they
      # 404 as "No route exists" rather than responding as a disabled
      # feature. Provision real Didit sandbox/production credentials here to
      # turn that into a working integration instead.
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      - key: DIDIT_POA_WORKFLOW_ID
        sync: false
      - key: DIDIT_CALLBACK_URL
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      - key: DIDIT_APPLICATION_ID
        sync: false
      - key: DIDIT_ENVIRONMENT
        sync: false
      - key: COINBASE_CDP_API_KEY_ID
        sync: false
      - key: COINBASE_CDP_API_KEY_SECRET
        sync: false
      - key: COINBASE_ONRAMP_REDIRECT_URL
        sync: false
      - key: RESERVATION_FUNDING_RAIL_ENABLED
        value: "false"

  - type: worker
    name: vistablox-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # No dockerCommand override: the default build already stops at the
    # `worker` stage, whose baked-in CMD is `node dist/worker.js`.
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      # Required by the shared environment schema even though worker.ts
      # never uses these three — see README's "Local setup" section
      # ("the same way it already requires but never uses BETTER_AUTH_SECRET").
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: OIDC_JWKS
        sync: false
      - key: OIDC_NATIVE_REDIRECT_URIS
        value: "com.vistablox.app:/oauth/callback"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PROFILE_CACHE_URL
        sync: false
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      - key: DIDIT_POA_WORKFLOW_ID
        sync: false
      - key: DIDIT_CALLBACK_URL
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      - key: DIDIT_APPLICATION_ID
        sync: false
      - key: DIDIT_ENVIRONMENT
        sync: false
      - key: COINBASE_CDP_API_KEY_ID
        sync: false
      - key: COINBASE_CDP_API_KEY_SECRET
        sync: false
      - key: COINBASE_ONRAMP_REDIRECT_URL
        sync: false
      # Dormant by default (AD-234's pattern) -- flip to "true" only once
      # deliberately ready to auto-run the monthly distribution sweep.
      - key: OPERATING_DISTRIBUTION_ENABLED
        value: "false"
      # Optional on-chain settlement integration (AD-163/AD-256), worker-only
      # (server.ts never touches chain state). All-together-or-none: leave
      # every key below unset in the dashboard until real contracts are
      # deployed and an operator wallet is funded -- this simply doesn't run
      # until then.
      - key: CHAIN_NETWORK
        sync: false
      - key: CHAIN_RPC_URL
        sync: false
      - key: CHAIN_OPERATOR_PRIVATE_KEY
        sync: false
      - key: VISTABLOX_PROPERTY_CONTRACT_ADDRESS
        sync: false
      - key: VISTABLOX_IPO_ESCROW_CONTRACT_ADDRESS
        sync: false
      - key: EURC_TOKEN_ADDRESS
        sync: false
      - key: PIV_TREASURY_ADDRESS
        sync: false
