services:
  vistablox-db-server:
    image: postgres:18-alpine
    env_file:
      - .env.staging
    environment:
      POSTGRES_USER: vistablox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}
      POSTGRES_DB: vistablox-db
    # No `ports:` here on purpose -- this stays reachable only from other
    # services on the compose network (api/worker/migrate), never published
    # to the host. Add a mapping back only if something outside this stack
    # genuinely needs a direct connection.
    volumes:
      - staging-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vistablox -d vistablox-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Email catcher: staging should never send to real inboxes, so SMTP_* below
  # points here instead of a real provider. Web UI at http://<host>:1080.
  maildev:
    build:
      context: .
      dockerfile: infrastructure/maildev/Dockerfile
    ports:
      - "1080:1080"

  # Private, persistent S3-compatible storage for disclosure and operational
  # documents. No host port is published: only services on this Compose
  # network can reach the object store; the API remains the authorization and
  # download boundary.
  minio:
    build:
      context: .
      dockerfile: infrastructure/minio/Dockerfile
    # The S3 API remains private, while the management console is reachable
    # only from this host's browser. Use SSH port forwarding for remote admin.
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env.staging}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env.staging}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - staging-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4.6
    volumes:
      - staging-clamav-data:/var/lib/clamav
      - ./infrastructure/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 --config-file=/etc/clamav/clamd.conf || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # One-shot bucket provisioning. Keeping this separate makes startup
  # idempotent and ensures the API never races bucket creation.
  storage-init:
    build:
      context: .
      target: api
    command: ["node", "dist/infrastructure/storage/ensure-minio-bucket.js"]
    env_file:
      - .env.staging
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env.staging}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env.staging}
      MINIO_QUARANTINE_BUCKET: ${MINIO_QUARANTINE_BUCKET:-vistablox-quarantine}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-vistablox-private}
      MINIO_KYC_BUCKET: ${MINIO_KYC_BUCKET:-vistablox-kyc}
      MINIO_DISCLOSURES_BUCKET: ${MINIO_DISCLOSURES_BUCKET:-vistablox-disclosures}
      MINIO_AUDIT_BUCKET: ${MINIO_AUDIT_BUCKET:-vistablox-audit}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: .
      target: migrate
    # One-shot: applies pending migrations then exits. Coolify defaults every
    # service to `restart: unless-stopped` when unset, which would otherwise
    # restart this forever (unless-stopped ignores exit code, so even a
    # clean exit-0 with nothing to migrate gets relaunched).
    restart: "no"
    env_file:
      - .env.staging
    environment:
      DIRECT_DATABASE_URL: postgresql://vistablox:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}@vistablox-db-server:5432/vistablox-db
    depends_on:
      vistablox-db-server:
        condition: service_healthy

  vistablox-api:
    build:
      context: .
      target: api
    # Kept published for local diagnostics; Traefik serves the public API over
    # the shared external `proxy` network below.
    ports:
      - "3000:3000"
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.vistablox-api.rule=Host(`api.vistablox.io`)
      - traefik.http.routers.vistablox-api.entrypoints=websecure
      - traefik.http.routers.vistablox-api.tls.certresolver=cloudflare
      - traefik.http.services.vistablox-api.loadbalancer.server.port=3000
    env_file:
      - .env.staging
    environment: &app-environment
      DATABASE_URL: postgresql://vistablox:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}@vistablox-db-server:5432/vistablox-db
      DIRECT_DATABASE_URL: postgresql://vistablox:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}@vistablox-db-server:5432/vistablox-db
      # Pinned so moving BETTER_AUTH_URL can never silently change it --
      # every enrolled passkey (customer and staff) is bound to this exact
      # value. The default keeps it pinned even if the Coolify var is
      # somehow missing, same reasoning as DPOP_PHASE1_CUTOVER_AT above.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-api.vistablox.io}
      # Comma-separated exact origins every WebAuthn ceremony accepts. Staging
      # sets https://api.vistablox.io,https://admin.vistablox.io so the admin
      # console can use staff passkeys; entries other than the rpId's own
      # host are served at /.well-known/webauthn and accept staff passkeys
      # only. Empty falls back to BETTER_AUTH_URL's origin.
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      # Admin-console pages linked from staff invitation / recovery emails.
      # Empty falls back to /staff/... on BETTER_AUTH_URL's host.
      STAFF_INVITATION_ACCEPT_URL: ${STAFF_INVITATION_ACCEPT_URL:-}
      STAFF_RECOVERY_REDIRECT_URL: ${STAFF_RECOVERY_REDIRECT_URL:-}
      # The images set NODE_ENV=production (see the Dockerfile), so APP_ENV is
      # what marks this deployment as staging. Staging-only settings, such as
      # PLAY_INTEGRITY_POLICY=disabled, are accepted here and nowhere else.
      APP_ENV: staging
      # Device-key auth (Android). "disabled" until a Play Console / Cloud
      # project exists; Android key attestation is enforced regardless, and
      # enrolment needs both ANDROID_ATTESTATION_* values set.
      PLAY_INTEGRITY_POLICY: ${PLAY_INTEGRITY_POLICY:-disabled}
      PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER:-}
      PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON: ${PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON:-}
      ANDROID_ATTESTATION_CERT_DIGESTS: ${ANDROID_ATTESTATION_CERT_DIGESTS:-}
      ANDROID_ATTESTATION_ROOT_CERTIFICATES: ${ANDROID_ATTESTATION_ROOT_CERTIFICATES:-}
      PASSKEY_APPLE_TEAM_ID: ${PASSKEY_APPLE_TEAM_ID:-}
      PASSKEY_ANDROID_ORIGINS: ${PASSKEY_ANDROID_ORIGINS:-}
      PASSKEY_ANDROID_SHA256_CERT_FINGERPRINTS: ${PASSKEY_ANDROID_SHA256_CERT_FINGERPRINTS:-}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Required outright -- no disabled mode. Both /v1/kyc's own session
      # creation/status and account recovery's re-verification flow read
      # this same required set.
      DIDIT_API_KEY: ${DIDIT_API_KEY}
      DIDIT_CALLBACK_URL: ${DIDIT_CALLBACK_URL}
      DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID}
      DIDIT_POA_WORKFLOW_ID: ${DIDIT_POA_WORKFLOW_ID:-}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET}
      DIDIT_APPLICATION_ID: ${DIDIT_APPLICATION_ID}
      DIDIT_ENVIRONMENT: ${DIDIT_ENVIRONMENT}
      RESERVATION_FUNDING_RAIL_ENABLED: ${RESERVATION_FUNDING_RAIL_ENABLED:-false}
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-false}
      # Optional on-chain settlement integration (AD-163/AD-256/AD-241) --
      # pre-existing gap, this anchor never passed any of these through even
      # though environment.ts has supported them for a while. All empty
      # until deployed contracts + a funded testnet operator key exist for
      # this environment; loadEnvironment() treats CHAIN_NETWORK/CHAIN_RPC_URL/
      # CHAIN_OPERATOR_PRIVATE_KEY/VISTABLOX_PROPERTY_CONTRACT_ADDRESS/
      # VISTABLOX_IPO_ESCROW_CONTRACT_ADDRESS/EURC_TOKEN_ADDRESS/
      # PIV_TREASURY_ADDRESS as all-together-or-none. Testnet-scoped per
      # AD-234 (production blockchain settlement stays dormant pending a
      # written-counsel memo).
      CHAIN_NETWORK: ${CHAIN_NETWORK:-}
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-}
      CHAIN_OPERATOR_PRIVATE_KEY: ${CHAIN_OPERATOR_PRIVATE_KEY:-}
      VISTABLOX_PROPERTY_CONTRACT_ADDRESS: ${VISTABLOX_PROPERTY_CONTRACT_ADDRESS:-}
      VISTABLOX_IPO_ESCROW_CONTRACT_ADDRESS: ${VISTABLOX_IPO_ESCROW_CONTRACT_ADDRESS:-}
      EURC_TOKEN_ADDRESS: ${EURC_TOKEN_ADDRESS:-}
      PIV_TREASURY_ADDRESS: ${PIV_TREASURY_ADDRESS:-}
      # AD-241's wallet registry, independently configurable of the CHAIN_*
      # bundle above -- see environment.ts's own comment on this var for why.
      VISTABLOX_WALLET_REGISTRY_CONTRACT_ADDRESS: ${VISTABLOX_WALLET_REGISTRY_CONTRACT_ADDRESS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The staging object store is the Compose-local MinIO service. These
      # values intentionally override any external endpoint left in the
      # shared .env.staging template.
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env.staging}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env.staging}
      MINIO_QUARANTINE_BUCKET: ${MINIO_QUARANTINE_BUCKET:-vistablox-quarantine}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-vistablox-private}
      MINIO_KYC_BUCKET: ${MINIO_KYC_BUCKET:-vistablox-kyc}
      MINIO_DISCLOSURES_BUCKET: ${MINIO_DISCLOSURES_BUCKET:-vistablox-disclosures}
      MINIO_AUDIT_BUCKET: ${MINIO_AUDIT_BUCKET:-vistablox-audit}
      SMTP_HOST: maildev
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: vistablox
      SMTP_PASSWORD: vistablox
      SMTP_FROM: VistaBlox <no-reply@vistablox.local>
    depends_on:
      vistablox-db-server:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      target: worker
    env_file:
      - .env.staging
    environment:
      <<: *app-environment
    depends_on:
      vistablox-db-server:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # The worker has no public listener. Its internal loopback-only probe is
    # ready only after pg-boss has started, every queue exists, schedules are
    # registered, and consumers are attached; its heartbeat then detects a
    # stalled event loop instead of merely proving PID 1 still exists.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  staging-postgres-data:
  staging-minio-data:
  staging-clamav-data:

networks:
  proxy:
    external: true
    name: proxy
