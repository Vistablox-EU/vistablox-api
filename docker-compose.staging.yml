services:
  vistablox-db-server:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: vistablox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vistablox-db
    # No `ports:` here on purpose -- this stays reachable only from other
    # services on the compose network (api/worker/migrate), never published
    # to the host. Add a mapping back only if something outside this stack
    # genuinely needs a direct connection.
    volumes:
      - staging-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vistablox -d vistablox-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Email catcher: staging should never send to real inboxes, so SMTP_* below
  # points here instead of a real provider. Web UI at http://<host>:1080.
  maildev:
    build:
      context: .
      dockerfile: infrastructure/maildev/Dockerfile
    ports:
      - "1080:1080"

  migrate:
    build:
      context: .
      target: migrate
    # One-shot: applies pending migrations then exits. Coolify defaults every
    # service to `restart: unless-stopped` when unset, which would otherwise
    # restart this forever (unless-stopped ignores exit code, so even a
    # clean exit-0 with nothing to migrate gets relaunched).
    restart: "no"
    environment:
      DIRECT_DATABASE_URL: postgresql://vistablox:${POSTGRES_PASSWORD}@vistablox-db-server:5432/vistablox-db
    depends_on:
      vistablox-db-server:
        condition: service_healthy

  vistablox-api:
    build:
      context: .
      target: api
    # The one port Coolify's proxy actually routes to (api.vistablox.io -> this).
    ports:
      - "3000:3000"
    environment: &app-environment
      DATABASE_URL: postgresql://vistablox:${POSTGRES_PASSWORD}@vistablox-db-server:5432/vistablox-db
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS}
      DPOP_PHASE1_CUTOVER_AT: ${DPOP_PHASE1_CUTOVER_AT:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-VistaBlox}
      # Pinned so moving BETTER_AUTH_URL can never silently change it --
      # every enrolled passkey (customer and staff) is bound to this exact
      # value. The default keeps it pinned even if the Coolify var is
      # somehow missing, same reasoning as DPOP_PHASE1_CUTOVER_AT above.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-api.vistablox.io}
      # Comma-separated exact origins every WebAuthn ceremony accepts. Staging
      # sets https://api.vistablox.io,https://admin.vistablox.io so the admin
      # console can use staff passkeys; entries other than the rpId's own
      # host are served at /.well-known/webauthn and accept staff passkeys
      # only. Empty falls back to BETTER_AUTH_URL's origin.
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      # Admin-console pages linked from staff invitation / recovery emails.
      # Empty falls back to /staff/... on BETTER_AUTH_URL's host.
      STAFF_INVITATION_ACCEPT_URL: ${STAFF_INVITATION_ACCEPT_URL:-}
      STAFF_RECOVERY_REDIRECT_URL: ${STAFF_RECOVERY_REDIRECT_URL:-}
      # The images set NODE_ENV=production (see the Dockerfile), so APP_ENV is
      # what marks this deployment as staging. Staging-only settings, such as
      # PLAY_INTEGRITY_POLICY=disabled, are accepted here and nowhere else.
      APP_ENV: staging
      # Device-key auth (Android). "disabled" until a Play Console / Cloud
      # project exists; Android key attestation is enforced regardless, and
      # enrolment needs both ANDROID_ATTESTATION_* values set.
      PLAY_INTEGRITY_POLICY: ${PLAY_INTEGRITY_POLICY:-disabled}
      PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER:-}
      PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON: ${PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON:-}
      ANDROID_ATTESTATION_CERT_DIGESTS: ${ANDROID_ATTESTATION_CERT_DIGESTS:-}
      ANDROID_ATTESTATION_ROOT_CERTIFICATES: ${ANDROID_ATTESTATION_ROOT_CERTIFICATES:-}
      PASSKEY_APPLE_TEAM_ID: ${PASSKEY_APPLE_TEAM_ID:-}
      PASSKEY_ANDROID_ORIGINS: ${PASSKEY_ANDROID_ORIGINS:-}
      PASSKEY_ANDROID_SHA256_CERT_FINGERPRINTS: ${PASSKEY_ANDROID_SHA256_CERT_FINGERPRINTS:-}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Required outright -- no disabled mode. Both /v1/kyc's own session
      # creation/status and account recovery's re-verification flow read
      # this same required set.
      DIDIT_API_KEY: ${DIDIT_API_KEY}
      DIDIT_CALLBACK_URL: ${DIDIT_CALLBACK_URL}
      DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID}
      DIDIT_POA_WORKFLOW_ID: ${DIDIT_POA_WORKFLOW_ID:-}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET}
      DIDIT_APPLICATION_ID: ${DIDIT_APPLICATION_ID}
      DIDIT_ENVIRONMENT: ${DIDIT_ENVIRONMENT}
      RESERVATION_FUNDING_RAIL_ENABLED: ${RESERVATION_FUNDING_RAIL_ENABLED:-false}
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: maildev
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: vistablox
      SMTP_PASSWORD: vistablox
      SMTP_FROM: VistaBlox <no-reply@vistablox.local>
    depends_on:
      vistablox-db-server:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *app-environment
    depends_on:
      vistablox-db-server:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  staging-postgres-data:
