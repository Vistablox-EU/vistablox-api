LogTime yes
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
# The clamav/clamav start script waits for this socket and stops the container
# when it is missing after CLAMD_STARTUP_TIMEOUT (30 minutes). The API still
# connects over TCP.
LocalSocket /tmp/clamd.sock
MaxThreads 2
MaxQueue 8
ConcurrentDatabaseReload no
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 150M
MaxRecursion 10
MaxFiles 10000
CommandReadTimeout 120
ReadTimeout 120
DatabaseDirectory /var/lib/clamav
